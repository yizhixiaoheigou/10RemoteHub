[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "remotehub"
version = "0.1.0"
description = "Cross-platform remote control mapping and external dictation audio bridge"
requires-python = ">=3.12,<3.15"
dependencies = [
  "PySide6==6.12.0", "numpy>=1.26,<3", "pynput>=1.8,<2",
  "hidapi>=0.14,<1", "pyusb>=1.3,<2", "libusb-package>=1.0,<2",
  "platformdirs>=4,<5",
  "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-qt>=4,<5", "pyinstaller>=6.11,<7", "dmgbuild>=1.6,<2"]

[project.scripts]
remotehub = "remotehub.app:main"

[tool.setuptools.packages.find]
include = ["remotehub*"]

[tool.setuptools.package-data]
remotehub = ["branding.json", "assets/*.png", "assets/*.svg", "assets/*.json", "models/*.json", "update-public.pem"]
"remotehub.codec" = ["COPYING.LGPLv2.1", "NOTICE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
